databaseChangeLog:
  - changeSet:
      id: 008-seed-categories
      author: student
      changes:
        - insert:
            tableName: categories
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: name, value: "Молочные продукты" }
        - insert:
            tableName: categories
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: name, value: "Хлеб и выпечка" }
        - insert:
            tableName: categories
            columns:
              - column: { name: id, valueNumeric: 3 }
              - column: { name: name, value: "Напитки" }

