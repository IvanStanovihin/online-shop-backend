databaseChangeLog:
  - changeSet:
      id: 003-create-categories
      author: student
      changes:
        - createTable:
            tableName: categories
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false, unique: true } }